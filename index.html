<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B Trade Hub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-left" aria-hidden="true"></div>
    <div class="bg-orb orb-right" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">B2B Marketplace</p>
          <h1>Trade Hub</h1>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn is-active" id="viewSellBtn" type="button">Продажи</button>
          <button class="ghost-btn" id="viewBuyBtn" type="button">Покупки</button>
          <button class="brand-btn" id="createBtn">Разместить объявление</button>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="workspace">
        <aside class="filters panel">
          <h2>Фильтры</h2>

          <label>
            Поиск
            <input id="searchInput" type="text" placeholder="Товар, компания, категория" autocomplete="off" />
          </label>

          <label>
            Категория
            <select id="categoryFilter">
              <option value="all">Все категории</option>
            </select>
          </label>

          <div class="legend">
            <h3>Фокус платформы</h3>
            <p>Прямые сделки между компаниями: оборудование, сырье, логистика, ИТ и услуги.</p>
          </div>
        </aside>

        <section class="board panel">
          <div class="board-top">
            <h2 id="boardTitle">Раздел продаж</h2>
            <div class="board-actions">
              <span id="resultCount" class="result-count"></span>
              <div class="view-toggle" role="group" aria-label="Выбор вида">
                <button class="ghost-btn small is-active" id="viewListBtn" type="button">Список</button>
                <button class="ghost-btn small" id="viewKanbanBtn" type="button">Канбан</button>
              </div>
            </div>
          </div>
          <ul id="cards" class="cards" aria-label="Ленты объявлений"></ul>
        </section>
      </section>
    </main>

    <dialog id="lotDialog" class="lot-dialog">
      <form id="lotForm" class="dialog-card" method="dialog">
        <div class="dialog-head">
          <h2>Новое объявление</h2>
          <button type="button" class="icon-btn" id="closeDialogBtn" aria-label="Закрыть">×</button>
        </div>

        <div class="dialog-grid">
          <label>
            Тип сделки
            <select name="type" required>
              <option value="sell">Компания продает</option>
              <option value="buy">Компания покупает</option>
            </select>
          </label>

          <label>
            Статус
            <select name="status" required>
              <option value="draft">Черновик</option>
              <option value="review">Проверка</option>
              <option value="published" selected>Опубликовано</option>
              <option value="bidding">Идут торги</option>
              <option value="done">Завершено</option>
            </select>
          </label>

          <label>
            Компания
            <input name="company" type="text" required maxlength="80" placeholder="ООО ТехСнаб" />
          </label>

          <label>
            Город
            <input name="city" type="text" required maxlength="60" placeholder="Москва" />
          </label>

          <label>
            Категория
            <input name="category" type="text" required maxlength="60" placeholder="Промышленное оборудование" />
          </label>

          <label>
            Заголовок объявления
            <input name="title" type="text" required maxlength="100" placeholder="Нужны канцтовары для офиса" />
          </label>
        </div>

        <section class="lots-builder">
          <div class="lots-head">
            <h3>Лоты в объявлении</h3>
            <button type="button" class="ghost-btn small" id="addLotBtn">Добавить лот</button>
          </div>
          <div id="lotItems" class="lot-items"></div>
          <p class="lots-hint">Для каждого лота укажите позицию, количество и максимальную цену за единицу.</p>
        </section>

        <label>
          Описание
          <textarea name="description" rows="4" maxlength="500" placeholder="Условия сделки, сроки отгрузки, требования к поставщику"></textarea>
        </label>

        <div class="dialog-actions">
          <button type="button" class="ghost-btn" id="cancelDialogBtn">Отмена</button>
          <button type="submit" class="brand-btn">Опубликовать</button>
        </div>
      </form>
    </dialog>

    <template id="cardTemplate">
      <li class="card-item">
        <article class="trade-card">
          <div class="card-badges">
            <span class="badge type-badge"></span>
            <span class="badge status-badge"></span>
            <span class="badge verify-badge">Проверенная компания</span>
          </div>
          <h3 class="card-title"></h3>
          <p class="card-desc"></p>
          <ul class="card-lots"></ul>
          <div class="card-meta"></div>
          <div class="card-footer">
            <div class="company"></div>
            <button class="ghost-btn small">Открыть сделку</button>
          </div>
        </article>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
